name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Serialize prod deploys; NEVER cancel one mid-flight — a half-applied
# container update is worse than a queued second run.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-twilio-cartoon-printer
  APP_NAME: twilio-cartoon-printer
  LOCATION: centralus
  ACR_NAME: twiliocartoonprinter
  ENV_NAME: cae-twilio-cartoon-printer
  STORAGE_ACCOUNT: twiliocartoonprinter
  FILE_SHARE: twilioprinterdata
  IMAGE_TAG: cartoon-printer:${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: ci
    if: needs.ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate authentication secrets
        env:
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          if [[ -n "$ADMIN_PIN" && ! "$ADMIN_PIN" =~ ^[A-Za-z0-9]{8,64}$ ]]; then
            echo "::error::ADMIN_PIN must contain only A-Z, a-z, and 0-9 and be 8-64 characters long."
            exit 1
          fi
          if (( ${#SESSION_SECRET} < 32 )); then
            echo "::error::SESSION_SECRET must be set and contain at least 32 characters."
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --- Infrastructure (idempotent — safe to run every time) ---

      - name: Ensure resource group exists
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --output none

      - name: Ensure Container Registry exists
        run: |
          az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} 2>/dev/null || \
          az acr create \
            --name ${{ env.ACR_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --sku Basic \
            --admin-enabled true \
            --output none

      - name: Ensure Storage Account exists
        run: |
          az storage account show --name ${{ env.STORAGE_ACCOUNT }} --resource-group ${{ env.RESOURCE_GROUP }} 2>/dev/null || \
          az storage account create \
            --name ${{ env.STORAGE_ACCOUNT }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --sku Standard_LRS \
            --output none

      - name: Ensure File Share exists
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --query '[0].value' -o tsv)
          az storage share create \
            --name ${{ env.FILE_SHARE }} \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --account-key "$STORAGE_KEY" \
            --quota 100 \
            --output none 2>/dev/null || true
          az storage share update \
            --name ${{ env.FILE_SHARE }} \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --account-key "$STORAGE_KEY" \
            --quota 100 \
            --output none

      - name: Ensure Container Apps Environment exists
        run: |
          az containerapp env show --name ${{ env.ENV_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} 2>/dev/null || \
          az containerapp env create \
            --name ${{ env.ENV_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --output none

      - name: Configure Azure Files storage mount
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --query '[0].value' -o tsv)
          az containerapp env storage set \
            --name ${{ env.ENV_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --storage-name appdata \
            --azure-file-account-name ${{ env.STORAGE_ACCOUNT }} \
            --azure-file-account-key "$STORAGE_KEY" \
            --azure-file-share-name ${{ env.FILE_SHARE }} \
            --access-mode ReadWrite \
            --output none

      # --- Build ---

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_TAG }} \
            --image cartoon-printer:latest \
            .

      # --- Deploy ---

      - name: Get ACR credentials
        id: acr-creds
        run: |
          {
            echo "server=${{ env.ACR_NAME }}.azurecr.io"
            echo "username=$(az acr credential show --name '${{ env.ACR_NAME }}' --query username -o tsv)"
            echo "password=$(az acr credential show --name '${{ env.ACR_NAME }}' --query 'passwords[0].value' -o tsv)"
          } >> "$GITHUB_OUTPUT"

      - name: Get Storage Key
        id: storage-key
        run: |
          echo "key=$(az storage account keys list \
            --resource-group '${{ env.RESOURCE_GROUP }}' \
            --account-name '${{ env.STORAGE_ACCOUNT }}' \
            --query '[0].value' -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Ensure Container App exists with required tags (tenant policy)
        run: |
          # The tenant 'tag-enforcement-policy' blocks any write to the Container
          # App resource unless required tags are present. Existing apps retain
          # the normal deploy path. A new app is bootstrapped at zero replicas so
          # its FQDN exists before secrets and the full revision are configured.
          APP_ID=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "id" -o tsv 2>/dev/null || true)
          if [ -n "$APP_ID" ]; then
            az tag update \
              --operation merge \
              --resource-id "$APP_ID" \
              --tags created_by=github-actions managed_by=twilio-cartoon-printer-ci \
              --output none
          else
            echo "Bootstrapping new container app..."
            az containerapp create \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.ENV_NAME }} \
              --image ${{ steps.acr-creds.outputs.server }}/${{ env.IMAGE_TAG }} \
              --ingress external \
              --target-port 8080 \
              --registry-server ${{ steps.acr-creds.outputs.server }} \
              --registry-username ${{ steps.acr-creds.outputs.username }} \
              --registry-password "${{ steps.acr-creds.outputs.password }}" \
              --min-replicas 0 \
              --max-replicas 1 \
              --tags created_by=github-actions managed_by=twilio-cartoon-printer-ci \
              --output none
          fi

      - name: Set secrets
        run: |
          # Set app secrets first (does NOT create a new revision, preserves registry secret)
          az containerapp secret set \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "twilio-sid=${{ secrets.TWILIO_ACCOUNT_SID }}" \
              "twilio-token=${{ secrets.TWILIO_AUTH_TOKEN }}" \
              "twilio-mssid=${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}" \
              "openai-key=${{ secrets.OPENAI_API_KEY }}" \
              "google-client-id=${{ secrets.GOOGLE_CLIENT_ID }}" \
              "google-client-secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              "admin-pin=${{ secrets.ADMIN_PIN }}" \
              "session-secret=${{ secrets.SESSION_SECRET }}" \
              "print-relay-key=${{ secrets.PRINT_RELAY_KEY }}" \
            --output none

      - name: Deploy Container App
        # ALLOWED_EMAILS = non-@twilio.com sign-in escape hatch, a plain (non-secret)
        # comma-separated GitHub repo variable, substituted into containerapp.yaml.
        # Empty = domain-only (renders as ALLOWED_EMAILS="").
        env:
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
          TWILIO_WHATSAPP_NUMBER: ${{ vars.TWILIO_WHATSAPP_NUMBER }}
          TWILIO_WHATSAPP_MESSAGING_SERVICE_SID: ${{ vars.TWILIO_WHATSAPP_MESSAGING_SERVICE_SID }}
          TWILIO_TEMPLATE_DELIVERY: ${{ vars.TWILIO_TEMPLATE_DELIVERY }}
          TWILIO_TEMPLATE_RATING: ${{ vars.TWILIO_TEMPLATE_RATING }}
          TWILIO_TEMPLATE_PROMO: ${{ vars.TWILIO_TEMPLATE_PROMO }}
          TWILIO_TEMPLATE_NUDGE: ${{ vars.TWILIO_TEMPLATE_NUDGE }}
          TWILIO_TEMPLATE_DELIVERY_PT_BR: ${{ vars.TWILIO_TEMPLATE_DELIVERY_PT_BR }}
          TWILIO_TEMPLATE_RATING_PT_BR: ${{ vars.TWILIO_TEMPLATE_RATING_PT_BR }}
          TWILIO_TEMPLATE_PROMO_PT_BR: ${{ vars.TWILIO_TEMPLATE_PROMO_PT_BR }}
          TWILIO_TEMPLATE_NUDGE_PT_BR: ${{ vars.TWILIO_TEMPLATE_NUDGE_PT_BR }}
        run: |
          # The bootstrap step guarantees a real FQDN even on the first deploy.
          FQDN=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          if [ -z "$FQDN" ]; then
            echo "Could not resolve container app FQDN."
            exit 1
          fi

          # Render YAML template with image, env vars, and volume mount
          export APP_NAME="${{ env.APP_NAME }}"
          export CONTAINER_IMAGE="${{ steps.acr-creds.outputs.server }}/${{ env.IMAGE_TAG }}"
          export BASE_URL="https://${FQDN}"
          export ALLOWED_EMAILS="${ALLOWED_EMAILS:-}"
          export TWILIO_WHATSAPP_NUMBER="${TWILIO_WHATSAPP_NUMBER:-}"
          export TWILIO_WHATSAPP_MESSAGING_SERVICE_SID="${TWILIO_WHATSAPP_MESSAGING_SERVICE_SID:-}"
          export TWILIO_TEMPLATE_DELIVERY="${TWILIO_TEMPLATE_DELIVERY:-}"
          export TWILIO_TEMPLATE_RATING="${TWILIO_TEMPLATE_RATING:-}"
          export TWILIO_TEMPLATE_PROMO="${TWILIO_TEMPLATE_PROMO:-}"
          export TWILIO_TEMPLATE_NUDGE="${TWILIO_TEMPLATE_NUDGE:-}"
          export TWILIO_TEMPLATE_DELIVERY_PT_BR="${TWILIO_TEMPLATE_DELIVERY_PT_BR:-}"
          export TWILIO_TEMPLATE_RATING_PT_BR="${TWILIO_TEMPLATE_RATING_PT_BR:-}"
          export TWILIO_TEMPLATE_PROMO_PT_BR="${TWILIO_TEMPLATE_PROMO_PT_BR:-}"
          export TWILIO_TEMPLATE_NUDGE_PT_BR="${TWILIO_TEMPLATE_NUDGE_PT_BR:-}"
          # shellcheck disable=SC2016
          # Restrict substitution to our known vars so no other ${...} in the template is touched.
          envsubst '${APP_NAME} ${CONTAINER_IMAGE} ${BASE_URL} ${ALLOWED_EMAILS} ${TWILIO_WHATSAPP_NUMBER} ${TWILIO_WHATSAPP_MESSAGING_SERVICE_SID} ${TWILIO_TEMPLATE_DELIVERY} ${TWILIO_TEMPLATE_RATING} ${TWILIO_TEMPLATE_PROMO} ${TWILIO_TEMPLATE_NUDGE} ${TWILIO_TEMPLATE_DELIVERY_PT_BR} ${TWILIO_TEMPLATE_RATING_PT_BR} ${TWILIO_TEMPLATE_PROMO_PT_BR} ${TWILIO_TEMPLATE_NUDGE_PT_BR}' < .github/containerapp.yaml > /tmp/containerapp.yaml

          echo "Updating container app registry credentials..."
          az containerapp registry set \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server ${{ steps.acr-creds.outputs.server }} \
            --username ${{ steps.acr-creds.outputs.username }} \
            --password "${{ steps.acr-creds.outputs.password }}" \
            --output none

          echo "Deploying image, env vars, and volume mount in a single revision..."
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --yaml /tmp/containerapp.yaml \
            --output none

      - name: Resolve app FQDN
        id: fqdn
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          if [ -z "$FQDN" ]; then echo "Could not resolve container app FQDN."; exit 1; fi
          REVISION=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.latestRevisionName -o tsv)
          REVISION_FQDN=$(az containerapp revision show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision "$REVISION" \
            --query properties.fqdn -o tsv)
          if [ -z "$REVISION_FQDN" ]; then echo "Could not resolve new revision FQDN."; exit 1; fi
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "revision-fqdn=$REVISION_FQDN" >> "$GITHUB_OUTPUT"

      - name: Smoke test /healthz
        # Wait until the new revision actually serves before reporting success, so a
        # deploy never "completes" while the app is still booting. The startup probe
        # in containerapp.yaml already holds traffic until /healthz passes; this is
        # the CI-side confirmation (and fails the run if the app never comes up).
        env:
          FQDN: ${{ steps.fqdn.outputs.fqdn }}
          REVISION_FQDN: ${{ steps.fqdn.outputs.revision-fqdn }}
        run: |
          for i in $(seq 1 45); do
            # Probe the new revision directly. The app FQDN can continue serving
            # the previous healthy revision while Container Apps warms this one.
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$REVISION_FQDN/healthz" || true)
            if [ "$CODE" = "200" ]; then
              echo "Healthz OK after attempt $i"
              echo ""
              echo "=========================================="
              echo "  Deployment complete!"
              echo "=========================================="
              echo "  App URL:        https://${FQDN}"
              echo "  Admin Console:  https://${FQDN}/home"
              echo "  Dashboard:      https://${FQDN}/dashboard"
              echo "  Twilio Webhook: https://${FQDN}/inbound (legacy /sms remains supported)"
              echo "=========================================="
              exit 0
            fi
            echo "Attempt $i: status=$CODE — retrying in 10s"; sleep 10
          done
          echo "::error::Healthz never returned 200 after 7.5 minutes."; exit 1
